<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquee tag</title>
</head>

<body>
    <marquee behavior="" direction="">
        <h1> Breaking news : upcoming sunday is the holiday 🕺💃</h1>
    </marquee>
    <marquee behavior="" direction="" scrollamount="10">
        <h1> it will move faster than above content</h1>
    </marquee>
    <marquee behavior="alternate" direction="right" scrollamount="35 ">
        <h1>behavior is alternate then it will hit the edge and <br> agian move the oppsite side </h1>
    </marquee>
    <marquee behavior="alternate" direction="up" loop="5" scrollamount="10">
        <h1>loop attritude is used to make action in n time</h1>
    </marquee>
    <marquee behavior="alternate" direction="right" loop="5" scrollamount="15">
        <img src="https://assets-v2.lottiefiles.com/a/49847160-3f53-11ef-8109-cbcc69139eb2/fZaPRJe15G.gif" alt="">
    </marquee>
    <marquee behavior="" direction="right" scrollamount="15">
        <img src="https://i.pinimg.com/originals/28/88/d4/2888d4e8258a084104408beff761cf87.gif" alt="">
    </marquee>




    <div>
        <h2>notes</h2>
        <p>deafult speedamount value is 6</p>
    </div>
</body>

</html>
